    </div>

function countUp(el, target, suffix='') {
  if (!el) return;
  const start = performance.now(), duration = 1400;
  const frame = (now) => {
    const p = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(ease * target) + suffix;
    if (p < 1) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

function initSpeedLines(canvas) {
  const ctx = canvas.getContext('2d');
  let W, H, lines=[], raf;
  const PALETTE = [
    {r:232,g:0,b:28,aMin:0.25,aMax:0.6,wMin:0.6,wMax:1.8},
    {r:255,g:255,b:255,aMin:0.03,aMax:0.12,wMin:0.4,wMax:1.0},
    {r:184,g:205,b:216,aMin:0.05,aMax:0.18,wMin:0.4,wMax:1.2},
  ];
  function resize() { W=canvas.width=canvas.offsetWidth; H=canvas.height=canvas.offsetHeight; }
  function makeLine(startRight=true) {
    const p=PALETTE[Math.floor(Math.random()*PALETTE.length)];
    return {x:startRight?W+20+Math.random()*300:Math.random()*W,y:H*(0.04+Math.random()*0.92),len:50+Math.random()*220,spd:3+Math.random()*11,alpha:p.aMin+Math.random()*(p.aMax-p.aMin),w:p.wMin+Math.random()*(p.wMax-p.wMin),color:`${p.r},${p.g},${p.b}`};
  }
  resize();
  window.addEventListener('resize', resize);
  for (let i=0;i<28;i++) lines.push(makeLine(false));
  function draw() {
    ctx.clearRect(0,0,W,H);
    lines.forEach((l,i)=>{
      l.x-=l.spd;
      if (l.x+l.len<0){lines[i]=makeLine(true);return;}
      const grad=ctx.createLinearGradient(l.x-l.len,0,l.x,0);
      grad.addColorStop(0,`rgba(${l.color},0)`);
      grad.addColorStop(1,`rgba(${l.color},${l.alpha})`);
      ctx.beginPath(); ctx.strokeStyle=grad; ctx.lineWidth=l.w;
      ctx.moveTo(l.x-l.len,l.y); ctx.lineTo(l.x,l.y); ctx.stroke();
    });
    raf=requestAnimationFrame(draw);
  }
  draw();
  return ()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize);};
}

// ─── APP ─────────────────────────────────────────────────────────────────────

function App() {
  const [activeSection, setActiveSection] = React.useState('hero');
  React.useEffect(()=>{
    const sections=['hero','products','engineering','about','contact'];
    const fn=()=>{
      const offset=120;
      for (let i=sections.length-1;i>=0;i--){
        const el=document.getElementById(sections[i]);
        if(el&&el.getBoundingClientRect().top<=offset){setActiveSection(sections[i]);return;}
      }
      setActiveSection('hero');
    };
    window.addEventListener('scroll',fn,{passive:true});
    return ()=>window.removeEventListener('scroll',fn);
  },[]);
  React.useEffect(()=>{
    const obs=new IntersectionObserver((entries)=>{
      entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');});
    },{threshold:0.06});
    const timer=setTimeout(()=>{
      document.querySelectorAll('.reveal,.reveal-left,.reveal-right').forEach(el=>obs.observe(el));
    },120);
    return ()=>{clearTimeout(timer);obs.disconnect();};
  },[]);
  return (
    <div style={{minHeight:'100vh',background:'#0B0B10'}}>
      <Header activeSection={activeSection}/>
      <HeroSection/>
      <ProductsSection/>
      <EngineeringSection/>
      <AboutSection/>
      <ContactSection/>
      <FooterSection/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
