<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDM Motorsports — Precision Parts Engineering</title>
  <meta name="description" content="Custom-engineered components for competitive motorsport.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:#06060A;color:#fff;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    #root{min-height:100vh}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-track{background:#06060A}
    ::-webkit-scrollbar-thumb{background:linear-gradient(to bottom,#E8001C,#B8CDD8);border-radius:2px}

    /* KEYFRAMES */
    @keyframes orb1{0%,100%{transform:translate(0,0) scale(1);opacity:.5}50%{transform:translate(40px,-35px) scale(1.15);opacity:.85}}
    @keyframes orb2{0%,100%{transform:translate(0,0) scale(1);opacity:.3}50%{transform:translate(-35px,40px) scale(.9);opacity:.65}}
    @keyframes orb3{0%,100%{transform:translate(0,0);opacity:.35}33%{transform:translate(25px,-45px);opacity:.65}66%{transform:translate(-25px,20px);opacity:.25}}
    @keyframes scan{0%{transform:translateY(0);opacity:0}5%{opacity:.5}95%{opacity:.5}100%{transform:translateY(100vh);opacity:0}}
    @keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
    @keyframes prog{from{width:0}to{width:var(--w,80%)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes fadein{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

    /* REVEAL */
    .reveal{opacity:0;transform:translateY(30px);transition:opacity .75s cubic-bezier(.22,1,.36,1),transform .75s cubic-bezier(.22,1,.36,1)}
    .reveal.visible{opacity:1;transform:none}
    .reveal-left{opacity:0;transform:translateX(-30px);transition:opacity .75s cubic-bezier(.22,1,.36,1),transform .75s cubic-bezier(.22,1,.36,1)}
    .reveal-left.visible{opacity:1;transform:none}
    .reveal-right{opacity:0;transform:translateX(30px);transition:opacity .75s cubic-bezier(.22,1,.36,1),transform .75s cubic-bezier(.22,1,.36,1)}
    .reveal-right.visible{opacity:1;transform:none}
    .d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}.d4{transition-delay:.32s}.d5{transition-delay:.40s}

    /* GLASSMORPHISM - gradient border trick using padding-box/border-box */
    .gb-red{
      background:
        linear-gradient(155deg,rgba(16,8,12,.88) 0%,rgba(16,16,28,.78) 100%) padding-box,
        linear-gradient(135deg,rgba(232,0,28,.5),rgba(255,80,80,.08),rgba(184,205,216,.12)) border-box;
      border:1px solid transparent;
    }
    .gb-red:hover{
      background:
        linear-gradient(155deg,rgba(20,8,14,.92) 0%,rgba(18,18,34,.85) 100%) padding-box,
        linear-gradient(135deg,rgba(232,0,28,.75),rgba(255,100,100,.18),rgba(184,205,216,.25)) border-box;
    }
    .gb-plat{
      background:
        linear-gradient(155deg,rgba(10,14,22,.88) 0%,rgba(14,16,30,.78) 100%) padding-box,
        linear-gradient(135deg,rgba(184,205,216,.32),rgba(255,255,255,.05),rgba(232,0,28,.14)) border-box;
      border:1px solid transparent;
    }
    .gb-subtle{
      background:
        linear-gradient(155deg,rgba(12,12,20,.75) 0%,rgba(16,16,28,.65) 100%) padding-box,
        linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02),rgba(232,0,28,.08)) border-box;
      border:1px solid transparent;
    }

    /* BLUR */
    .blur24{backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
    .blur32{backdrop-filter:blur(32px) saturate(200%);-webkit-backdrop-filter:blur(32px) saturate(200%)}

    /* PATTERNS */
    .dot-grid{background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:30px 30px}
    .line-grid{background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:48px 48px}

    /* PROGRESS */
    .prog-track{height:1.5px;background:rgba(255,255,255,.07);border-radius:1px;overflow:hidden;margin-top:10px}
    .prog-fill{height:100%;background:linear-gradient(90deg,#E8001C,#FF4444);border-radius:1px;width:0;transition:width 1.5s cubic-bezier(.22,1,.36,1);box-shadow:0 0 8px rgba(232,0,28,.65)}
    .prog-fill.on{width:var(--w,85%)}

    /* BADGES */
    .br{display:inline-flex;align-items:center;padding:3px 9px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;background:rgba(232,0,28,.1);color:rgba(232,0,28,.9);border:1px solid rgba(232,0,28,.22)}
    .bp{display:inline-flex;align-items:center;padding:3px 9px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;background:rgba(184,205,216,.07);color:rgba(184,205,216,.8);border:1px solid rgba(184,205,216,.18)}

    /* FORM */
    input::placeholder,textarea::placeholder{color:rgba(90,90,114,.55)}
    input,textarea,select{color:#fff}
    select option{background:#10101C;color:#fff}

    /* NAV */
    .navd{display:flex}
    .navmb{display:none}

    /* RESPONSIVE */
    @media(max-width:900px){
      .navd{display:none!important}
      .navcta{display:none!important}
      .navmb{display:block!important}
      .hc{padding:100px 24px 40px!important}
      .hs{padding:0 24px 48px!important}
      .hsg{grid-template-columns:repeat(2,1fr)!important}
      .si{padding:0 24px!important}
      .tc{grid-template-columns:1fr!important;gap:32px!important}
      .pg{grid-template-columns:1fr!important}
      .thr{grid-template-columns:1fr!important}
      .foc{grid-template-columns:repeat(2,1fr)!important}
      .fg{grid-template-columns:1fr 1fr!important;gap:32px!important}
      .cg{grid-template-columns:1fr!important;gap:40px!important}
      .eg{grid-template-columns:1fr!important;gap:0!important}
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const T={
  bg:'#06060A',s1:'#0C0C16',s2:'#121220',s3:'#181830',
  red:'#E8001C',redDk:'#B8001A',redLt:'#FF2233',
  plat:'#B8CDD8',platDk:'#7A9AAA',platLt:'#D8E8EE',
  off:'#D0D0DC',muted:'#585872',subtle:'#343450',
  b:'rgba(255,255,255,.07)',bm:'rgba(255,255,255,.11)',
};

function Mk({sz=40,style={}}){return(
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" style={{width:sz,height:sz,flexShrink:0,...style}}>
    <polygon points="40,4 76,40 40,76 4,40" fill="#E8001C"/>
    <g fill="#fff">
      <path d="M10 28h6l8 14 8-14h6v24H32V40l-6 10h-2l-6-10v12H10V28z"/>
      <path d="M40 28h10c7 0 11 4.5 11 12s-4 12-11 12H40V28zm5 5v14h4c3.5 0 6-2.5 6-7s-2.5-7-6-7h-4z"/>
    </g>
    <rect x="16" y="57" width="48" height="2" rx="1" fill="#B8CDD8"/>
  </svg>
);}

function Logo({h=44,style={}}){return(
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" style={{height:h,width:'auto',...style}}>
    <g fill="#fff">
      <path d="M8 16h10l14 28 14-28h10v48H46V36l-10 20h-4L22 36v28H8V16z"/>
      <path d="M62 16h18c14 0 22 9 22 24s-8 24-22 24H62V16zm10 10v28h7c7 0 13-5 13-14s-6-14-13-14h-7z"/>
      <path d="M108 16h10l14 28 14-28h10v48h-10V36l-10 20h-4l-10-20v28h-10V16z"/>
    </g>
    <text x="162" y="44" fontFamily="'Orbitron',sans-serif" fontSize="22" fontWeight="700" letterSpacing="6" fill="#B8CDD8" textAnchor="start">MOTORSPORTS</text>
    <rect x="8" y="70" width="304" height="2" fill="#E8001C"/>
  </svg>
);}

function Div({w=48,style={}}){return <div style={{width:w,height:2,background:`linear-gradient(90deg,${T.red},${T.redLt})`,flexShrink:0,borderRadius:1,boxShadow:`0 0 10px rgba(232,0,28,.5)`,...style}}/>;}

function SL({children,style={}}){return(
  <div style={{display:'flex',alignItems:'center',gap:10,fontFamily:"'Inter',sans-serif",fontSize:10,fontWeight:600,color:T.red,letterSpacing:'0.2em',textTransform:'uppercase',...style}}>
    <div style={{width:20,height:1.5,background:`linear-gradient(90deg,${T.red},${T.redLt})`,boxShadow:`0 0 6px rgba(232,0,28,.6)`,flexShrink:0}}/>
    {children}
  </div>
);}

function countUp(el,target,suffix=''){
  if(!el) return;
  const s=performance.now(),d=1500;
  const f=(n)=>{
    const p=Math.min((n-s)/d,1),e=1-Math.pow(1-p,4);
    el.textContent=Math.round(e*target)+suffix;
    if(p<1) requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}

function Tilt({children,style={},className='',onMouseEnter,onMouseLeave}){
  const ref=React.useRef(null);
  const mv=(e)=>{
    const el=ref.current;if(!el) return;
    const r=el.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5;
    const y=(e.clientY-r.top)/r.height-.5;
    el.style.transform=`perspective(900px) rotateX(${y*-10}deg) rotateY(${x*10}deg) translateZ(8px)`;
    el.style.boxShadow=`${x*-28}px ${y*-28}px 48px rgba(232,0,28,.13),0 24px 60px rgba(0,0,0,.6)`;
  };
  const lv=()=>{
    const el=ref.current;if(!el) return;
    el.style.transform='';
    el.style.boxShadow='';
    if(onMouseLeave) onMouseLeave();
  };
  return <div ref={ref} className={className} style={{transition:'transform .2s ease,box-shadow .2s ease',...style}} onMouseMove={mv} onMouseLeave={lv} onMouseEnter={onMouseEnter}>{children}</div>;
}

function initLines(canvas){
  const ctx=canvas.getContext('2d');
  let W,H,lines=[],raf;
  const PAL=[
    {r:232,g:0,b:28,aMin:.28,aMax:.72,wMin:.8,wMax:2.2,glow:true},
    {r:255,g:255,b:255,aMin:.02,aMax:.1,wMin:.4,wMax:1.0,glow:false},
    {r:184,g:205,b:216,aMin:.05,aMax:.2,wMin:.4,wMax:1.2,glow:false},
  ];
  const resize=()=>{W=canvas.width=canvas.offsetWidth;H=canvas.height=canvas.offsetHeight;};
  const make=(fr=true)=>{
    const p=PAL[Math.floor(Math.random()*PAL.length)];
    return{x:fr?W+40+Math.random()*400:Math.random()*W,y:H*(.04+Math.random()*.92),len:60+Math.random()*280,spd:4+Math.random()*14,a:p.aMin+Math.random()*(p.aMax-p.aMin),w:p.wMin+Math.random()*(p.wMax-p.wMin),c:`${p.r},${p.g},${p.b}`,glow:p.glow};
  };
  resize();
  window.addEventListener('resize',resize);
  for(let i=0;i<34;i++) lines.push(make(false));
  const draw=()=>{
    ctx.clearRect(0,0,W,H);
    lines.forEach((l,i)=>{
      l.x-=l.spd;
      if(l.x+l.len<0){lines[i]=make(true);return;}
      const g=ctx.createLinearGradient(l.x-l.len,0,l.x,0);
      g.addColorStop(0,`rgba(${l.c},0)`);
      g.addColorStop(1,`rgba(${l.c},${l.a})`);
      ctx.save();
      if(l.glow){ctx.shadowBlur=8;ctx.shadowColor=`rgba(${l.c},.9)`;}
      ctx.beginPath();ctx.strokeStyle=g;ctx.lineWidth=l.w;
      ctx.moveTo(l.x-l.len,l.y);ctx.lineTo(l.x,l.y);ctx.stroke();
      ctx.restore();
    });
    raf=requestAnimationFrame(draw);
  };
  draw();
  return()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize);};
}

// ─── HEADER ───────────────────────────────────────────────────────────────────

function Header({active}){
  const [sc,setSc]=React.useState(false);
  const [mo,setMo]=React.useState(false);
  const nav=[{l:'Home',id:'hero'},{l:'Products',id:'products'},{l:'Engineering',id:'engineering'},{l:'About',id:'about'},{l:'Contact',id:'contact'}];
  React.useEffect(()=>{
    const fn=()=>setSc(window.scrollY>55);
    window.addEventListener('scroll',fn,{passive:true});
    return()=>window.removeEventListener('scroll',fn);
  },[]);
  const go=(id)=>{
    const el=document.getElementById(id);
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-64,behavior:'smooth'});
    setMo(false);
  };
  return(
    <header style={{position:'fixed',top:0,left:0,right:0,zIndex:1000,
      background:sc?'rgba(6,6,10,.9)':'transparent',
      backdropFilter:sc?'blur(28px) saturate(180%)':'none',
      WebkitBackdropFilter:sc?'blur(28px) saturate(180%)':'none',
      borderBottom:sc?`1px solid rgba(232,0,28,.08)`:'none',
      boxShadow:sc?'0 1px 0 rgba(232,0,28,.07),0 4px 32px rgba(0,0,0,.4)':'none',
      transition:'background .4s,backdrop-filter .4s,border-color .4s,box-shadow .4s'}}>
      <div style={{maxWidth:1280,margin:'0 auto',height:64,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 48px'}}>
        <button onClick={()=>go('hero')} style={{background:'none',border:'none',cursor:'pointer',padding:0,display:'flex',alignItems:'center',gap:10}}>
          <Mk sz={28}/>
          <div>
            <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:14,fontWeight:800,color:'#fff',letterSpacing:'.02em',lineHeight:1}}>MDM</div>
            <div style={{fontFamily:"'Inter',sans-serif",fontSize:7,fontWeight:600,color:T.muted,letterSpacing:'.22em',textTransform:'uppercase',marginTop:2}}>MOTORSPORTS</div>
          </div>
        </button>
        <nav className="navd" style={{gap:2}}>
          {nav.map(item=>{
            const on=active===item.id;
            return(
              <button key={item.id} onClick={()=>go(item.id)} style={{background:'none',border:'none',cursor:'pointer',fontFamily:"'Inter',sans-serif",fontSize:12.5,fontWeight:on?600:400,color:on?'#fff':T.muted,padding:'8px 16px',letterSpacing:'.03em',position:'relative',transition:'color 200ms'}}
                onMouseEnter={e=>{if(!on)e.currentTarget.style.color=T.off;}}
                onMouseLeave={e=>{if(!on)e.currentTarget.style.color=T.muted;}}>
                {item.l}
                {on&&<div style={{position:'absolute',bottom:4,left:16,right:16,height:1.5,background:`linear-gradient(90deg,${T.red},${T.redLt})`,borderRadius:1,boxShadow:`0 0 8px rgba(232,0,28,.6)`}}/>}
              </button>
            );
          })}
        </nav>
        <button className="navcta navd" onClick={()=>go('contact')}
          style={{fontFamily:"'Inter',sans-serif",fontSize:11,fontWeight:600,letterSpacing:'.12em',textTransform:'uppercase',
            background:`linear-gradient(135deg,${T.red},${T.redLt})`,color:'#fff',border:'none',borderRadius:3,
            padding:'9px 22px',cursor:'pointer',transition:'box-shadow .2s,transform .15s',
            boxShadow:'0 4px 20px rgba(232,0,28,.25)'}}
          onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 0 32px rgba(232,0,28,.6),0 8px 28px rgba(232,0,28,.35)';e.currentTarget.style.transform='translateY(-1px)';}}
          onMouseLeave={e=>{e.currentTarget.style.boxShadow='0 4px 20px rgba(232,0,28,.25)';e.currentTarget.style.transform='';}}>
          Get a Quote
        </button>
        <button className="navmb" onClick={()=>setMo(o=>!o)} style={{background:'none',border:'none',cursor:'pointer',color:'#fff',padding:8}}>
          <svg width="22" height="16" viewBox="0 0 22 16" fill="none"><rect y="0" width="22" height="2" rx="1" fill="white"/><rect y="7" width="22" height="2" rx="1" fill="white"/><rect y="14" width="22" height="2" rx="1" fill="white"/></svg>
        </button>
      </div>
      {mo&&(
        <div style={{background:'rgba(6,6,10,.98)',backdropFilter:'blur(28px)',borderBottom:`1px solid ${T.b}`,padding:'16px 24px 24px'}}>
          {nav.map(item=>(
            <button key={item.id} onClick={()=>go(item.id)} style={{display:'block',width:'100%',background:'none',border:'none',cursor:'pointer',fontFamily:"'Inter',sans-serif",fontSize:15,color:active===item.id?'#fff':T.muted,fontWeight:active===item.id?600:400,padding:'12px 0',textAlign:'left',letterSpacing:'.03em',borderBottom:`1px solid ${T.b}`}}>{item.l}</button>
          ))}
          <button onClick={()=>go('contact')} style={{marginTop:16,fontFamily:"'Inter',sans-serif",fontSize:11,fontWeight:600,letterSpacing:'.12em',textTransform:'uppercase',background:`linear-gradient(135deg,${T.red},${T.redLt})`,color:'#fff',border:'none',borderRadius:3,padding:'12px 22px',cursor:'pointer',width:'100%'}}>Get a Quote</button>
        </div>
      )}
    </header>
  );
}

// ─── HERO ─────────────────────────────────────────────────────────────────────

function Hero(){
  const cvs=React.useRef(null);
  React.useEffect(()=>{if(cvs.current) return initLines(cvs.current);},[]);
  const stats=[
    {v:'±0.001',u:'mm',l:'Machining Tolerance'},
    {v:'48',u:'hr',l:'Rapid Prototype'},
    {v:'ISO',u:'9001',l:'Quality Certified'},
    {v:'20',u:'+',l:'Years Racing'},
  ];
  const go=(id)=>{const el=document.getElementById(id);if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-64,behavior:'smooth'});};
  return(
    <section id="hero" style={{position:'relative',minHeight:'100vh',background:T.bg,display:'flex',flexDirection:'column',justifyContent:'center',overflow:'hidden'}}>
      {/* Base gradient */}
      <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse 90% 80% at -10% 120%,rgba(232,0,28,.2) 0%,transparent 55%),radial-gradient(ellipse 60% 60% at 110% -10%,rgba(184,205,216,.06) 0%,transparent 50%)',zIndex:0,pointerEvents:'none'}}/>
      {/* Dot grid */}
      <div className="dot-grid" style={{position:'absolute',inset:0,zIndex:0,pointerEvents:'none',opacity:.8}}/>
      {/* Floating orbs */}
      <div style={{position:'absolute',width:700,height:700,top:'-15%',right:'-8%',borderRadius:'50%',background:'radial-gradient(circle,rgba(232,0,28,.1) 0%,transparent 65%)',filter:'blur(50px)',animation:'orb1 10s ease-in-out infinite',pointerEvents:'none',zIndex:1}}/>
      <div style={{position:'absolute',width:500,height:500,bottom:'-5%',left:'-5%',borderRadius:'50%',background:'radial-gradient(circle,rgba(184,205,216,.07) 0%,transparent 65%)',filter:'blur(50px)',animation:'orb2 14s ease-in-out infinite',pointerEvents:'none',zIndex:1}}/>
      <div style={{position:'absolute',width:280,height:280,top:'35%',right:'28%',borderRadius:'50%',background:'radial-gradient(circle,rgba(232,0,28,.06) 0%,transparent 70%)',filter:'blur(35px)',animation:'orb3 18s ease-in-out infinite',pointerEvents:'none',zIndex:1}}/>
      {/* Speed lines */}
      <canvas ref={cvs} style={{position:'absolute',inset:0,width:'100%',height:'100%',zIndex:2,pointerEvents:'none'}}/>
      {/* Scanline */}
      <div style={{position:'absolute',top:0,left:0,right:0,height:1,background:`linear-gradient(90deg,transparent,rgba(232,0,28,.45),transparent)`,animation:'scan 9s linear infinite',zIndex:3,pointerEvents:'none'}}/>
      {/* Diagonal accent */}
      <div style={{position:'absolute',top:0,right:'22%',width:1,height:'100%',background:'linear-gradient(to bottom,transparent,rgba(232,0,28,.1),transparent)',transform:'skewX(-8deg)',zIndex:2,pointerEvents:'none'}}/>

      {/* Content */}
      <div className="hc" style={{position:'relative',zIndex:4,maxWidth:1280,margin:'0 auto',width:'100%',padding:'130px 64px 40px'}}>
        <div style={{maxWidth:780}}>
          <div className="reveal" style={{marginBottom:28}}><SL>Silverstone, UK · Est. 2003</SL></div>
          <div className="reveal">
            <h1 style={{fontFamily:"'Orbitron',sans-serif",fontSize:'clamp(52px,8.5vw,118px)',fontWeight:900,lineHeight:.87,color:'#fff',letterSpacing:'-0.03em',textTransform:'uppercase'}}>PRECISION</h1>
          </div>
          <div className="reveal d1" style={{marginBottom:26}}>
            <h1 style={{fontFamily:"'Orbitron',sans-serif",fontSize:'clamp(52px,8.5vw,118px)',fontWeight:900,lineHeight:.87,letterSpacing:'-0.03em',textTransform:'uppercase',
              background:'linear-gradient(135deg,#fff 0%,#D8E8EE 35%,#B8CDD8 65%,#FF3333 100%)',
              WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>ENGINEERED.</h1>
          </div>
          <Div w={48} style={{marginBottom:26}}/>
          <p className="reveal d2" style={{fontFamily:"'Inter',sans-serif",fontSize:16,fontWeight:300,color:'rgba(255,255,255,.44)',lineHeight:1.9,maxWidth:468,marginBottom:46}}>
            Custom-engineered components for competitive motorsport. From CAD brief to race-ready part — at tolerances measured in microns.
          </p>
          <div className="reveal d3" style={{display:'flex',gap:14,alignItems:'center',flexWrap:'wrap'}}>

                  <F label="Name" style={{flex:1,minWidth:120}}><input style={base} placeholder="Your name" value={form.name} onChange={e=>up('name',e.target.value)} onFocus={fi} onBlur={fb}/></F>
                  <F label="Organisation" style={{flex:1,minWidth:120}}><input style={base} placeholder="Team or company" value={form.org} onChange={e=>up('org',e.target.value)} onFocus={fi} onBlur={fb}/></F>
                </div>
                <F label="Email"><input style={base} type="email" placeholder="you@example.com" value={form.email} onChange={e=>up('email',e.target.value)} onFocus={fi} onBlur={fb}/></F>
                <F label="Category"><select style={{...base,cursor:'pointer',appearance:'none',WebkitAppearance:'none'}} value={form.cat} onChange={e=>up('cat',e.target.value)} onFocus={fi} onBlur={fb}>{CATS.map(c=><option key={c}>{c}</option>)}</select></F>
                <F label="Racing Series"><input style={base} placeholder="WEC, GT3, IMSA, F4, etc." value={form.series} onChange={e=>up('series',e.target.value)} onFocus={fi} onBlur={fb}/></F>
                <F label="Requirements"><textarea style={{...base,height:88,resize:'none'}} placeholder="Material, load cases, target weight, deadline…" value={form.msg} onChange={e=>up('msg',e.target.value)} onFocus={fi} onBlur={fb}/></F>
                <button onClick={()=>setSent(true)}
                  style={{fontFamily:"'Inter',sans-serif",fontSize:11,fontWeight:600,letterSpacing:'.12em',textTransform:'uppercase',
                    background:`linear-gradient(135deg,${T.red},${T.redLt})`,color:'#fff',border:'none',borderRadius:3,
                    padding:'14px 28px',cursor:'pointer',marginTop:4,transition:'box-shadow .2s,transform .15s',
                    boxShadow:'0 4px 20px rgba(232,0,28,.28)'}}
                  onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 0 36px rgba(232,0,28,.65),0 8px 32px rgba(232,0,28,.4)';e.currentTarget.style.transform='translateY(-1px)';}}
                  onMouseLeave={e=>{e.currentTarget.style.boxShadow='0 4px 20px rgba(232,0,28,.28)';e.currentTarget.style.transform='';}}>
                  Send Enquiry
                </button>
              </div>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────

function App(){
  const [active,setActive]=React.useState('hero');
  React.useEffect(()=>{
    const secs=['hero','products','engineering','about','contact'];
    const fn=()=>{
      for(let i=secs.length-1;i>=0;i--){
        const el=document.getElementById(secs[i]);
        if(el&&el.getBoundingClientRect().top<=120){setActive(secs[i]);return;}
      }
      setActive('hero');
    };
    window.addEventListener('scroll',fn,{passive:true});
    return()=>window.removeEventListener('scroll',fn);
  },[]);
  React.useEffect(()=>{
    const obs=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting) e.target.classList.add('visible');});
    },{threshold:.06});
    const t=setTimeout(()=>{
      document.querySelectorAll('.reveal,.reveal-left,.reveal-right').forEach(el=>obs.observe(el));
    },100);
    return()=>{clearTimeout(t);obs.disconnect();};
  },[]);
  return(
    <div style={{minHeight:'100vh',background:T.bg}}>
      <Header active={active}/>
      <Hero/>
      <Products/>
      <Engineering/>
      <About/>
      <Contact/>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
