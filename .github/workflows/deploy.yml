name: Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Surge
        run: |
          npm install -g surge 2>/dev/null

          EMAIL="mdm-lucaschitos@outlook.com"
          PASS="MDMMotorsports2026"
          DOMAIN="lucaschitos-mdm.surge.sh"

          TOKEN=$(curl -sf "https://surge.sh/token?email=${EMAIL}&password=${PASS}" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])" 2>/dev/null)

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not get surge token"
            exit 1
          fi

          SURGE_LOGIN="$EMAIL" SURGE_TOKEN="$TOKEN" surge . "$DOMAIN"
          echo ""
          echo "=============================="
          echo "LIVE URL: https://$DOMAIN"
          echo "=============================="
